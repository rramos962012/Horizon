<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#171C23" />
<title>Credential Curriculum — SMART Tracker</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap');

:root{
  --ink:#171C23; --muted:#5C6672; --faint:#8B95A1;
  --line:#C9D2DC; --hair:#DEE4EB; --paper:#EAEEF3; --card:#FCFDFE; --grid:#DBE2EA;
  --gs:'Space Grotesk',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --body:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;}
body{
  color:var(--ink); font-family:var(--body); -webkit-font-smoothing:antialiased;
  background:
    linear-gradient(var(--grid) 1px, transparent 1px) 0 0/100% 26px,
    linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/26px 100%,
    var(--paper);
}
.rm-root{max-width:1120px; margin:0 auto; padding:26px 22px 60px;}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
button:focus-visible{outline:2px solid #1D6E93; outline-offset:2px; border-radius:3px;}

.rm-titleblock{display:flex; justify-content:space-between; align-items:stretch; gap:20px;
  background:var(--card); border:1.5px solid var(--ink); padding:20px 22px; flex-wrap:wrap;
  box-shadow:6px 6px 0 rgba(23,28,35,.06);}
.rm-tb-eyebrow{font-family:var(--mono); font-size:10px; letter-spacing:.2em; color:var(--muted); margin-bottom:8px;}
.rm-tb-title{font-family:var(--gs); font-weight:700; font-size:clamp(28px,5vw,44px); letter-spacing:-.02em; line-height:.98; margin:0;}
.rm-tb-sub{font-size:13px; color:var(--muted); margin:10px 0 0; max-width:40ch;}
.rm-tb-right{display:flex; align-items:center; gap:18px;}
.rm-tb-meta{display:grid; grid-template-columns:1fr 1fr; border:1px solid var(--line);}
.rm-metacell{padding:7px 12px; border:.5px solid var(--hair); min-width:104px;}
.rm-metacell-k{display:block; font-family:var(--mono); font-size:9px; letter-spacing:.16em; color:var(--faint);}
.rm-metacell-v{display:block; font-family:var(--mono); font-size:12.5px; font-weight:600; margin-top:2px;}

.rm-gauge{position:relative; width:76px; height:76px; flex:none;}
.rm-gauge-track{fill:none; stroke:var(--hair); stroke-width:6;}
.rm-gauge-fill{fill:none; stroke:#1D6E93; stroke-width:6; stroke-linecap:round; transition:stroke-dashoffset .6s cubic-bezier(.4,0,.2,1);}
.rm-gauge-num{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--gs); font-weight:700; font-size:22px;}
.rm-gauge-num small{font-size:11px; font-weight:600; color:var(--muted); margin-left:1px;}

.rm-readout{display:grid; grid-template-columns:repeat(5,1fr); margin-top:14px; border:1px solid var(--line); background:var(--card);}
.rm-readout-cell{padding:12px 14px; border-right:1px solid var(--hair);}
.rm-readout-cell:last-child{border-right:none;}
.rm-readout-cell.is-accent{background:#FBF4E9;}
.rm-readout-k{display:block; font-family:var(--mono); font-size:9px; letter-spacing:.14em; color:var(--faint); text-transform:uppercase;}
.rm-readout-v{display:block; font-family:var(--gs); font-weight:700; font-size:19px; margin-top:4px; letter-spacing:-.01em;}
.rm-readout-sub{display:block; font-family:var(--mono); font-size:10px; color:var(--muted); margin-top:2px;}

.rm-panel{margin-top:22px; background:var(--card); border:1px solid var(--line);}
.rm-panel-head{display:flex; align-items:baseline; gap:12px; padding:11px 16px; border-bottom:1px solid var(--hair); flex-wrap:wrap;}
.rm-panel-label{font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:.18em;}
.rm-panel-note{font-family:var(--mono); font-size:10.5px; color:var(--faint);}

.rm-ovwrap{overflow-x:auto;}
.rm-ov{width:100%; border-collapse:collapse; min-width:640px;}
.rm-ov th{font-family:var(--mono); font-size:9px; letter-spacing:.12em; text-transform:uppercase; color:var(--faint); text-align:left; padding:9px 14px; border-bottom:1px solid var(--hair); font-weight:600;}
.rm-ov td{padding:11px 14px; border-bottom:1px solid var(--hair); font-size:12.5px; vertical-align:middle;}
.rm-ov tr:last-child td{border-bottom:none;}
.rm-ov-num{text-align:center;}
.rm-ov-mono{font-family:var(--mono); font-size:11px;}
.rm-ov-n{font-family:var(--gs); font-weight:700; font-size:15px;}
.rm-ov-focus{display:block; font-weight:600;}
.rm-ov-months{display:block; font-family:var(--mono); font-size:9.5px; color:var(--faint); margin-top:1px;}
.rm-ov-certs{color:var(--muted); font-size:12px; max-width:230px;}
.rm-ov-cost{color:var(--muted); white-space:nowrap;}

.rm-gantt-scroll{overflow-x:auto;}
.rm-gantt{min-width:860px; padding:0 0 12px;}
.rm-gantt-months{display:flex; padding-left:200px; padding-top:8px;}
.rm-gantt-mon{flex:1; text-align:center; font-family:var(--mono); font-size:9px; color:var(--faint); position:relative; padding-bottom:6px;}
.rm-gantt-mon.is-year{color:var(--ink); font-weight:600;}
.rm-gantt-mon em{display:block; font-style:normal; font-size:8px; color:var(--muted);}
.rm-gantt-body{position:relative;}
.rm-gantt-overlay{position:absolute; top:0; bottom:0; left:200px; right:0; pointer-events:none; z-index:4;}
.rm-gantt-today{position:absolute; top:0; bottom:0; width:1.5px; background:#C0392B;}
.rm-gantt-today-tag{position:absolute; top:-2px; left:3px; font-family:var(--mono); font-size:8px; font-weight:600; color:#C0392B; letter-spacing:.08em;}
.rm-gantt-row{display:flex; align-items:center; height:36px;}
.rm-gantt-rowlabel{width:200px; flex:none; font-size:12px; font-weight:500; padding-right:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; align-items:center; gap:8px;}
.rm-gantt-n{font-family:var(--mono); font-size:10px; font-weight:600;}
.rm-gantt-track{position:relative; flex:1; height:100%; background-image:linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size:calc(100%/25) 100%;}
.rm-gantt-bar{position:absolute; top:8px; height:20px; border-radius:2px; overflow:hidden; display:flex; align-items:center;}
.rm-gantt-fill{position:absolute; left:0; top:0; bottom:0; opacity:.5;}
.rm-gantt-bar-label{position:relative; z-index:2; font-family:var(--mono); font-size:8.5px; font-weight:600; padding:0 6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.rm-legend{display:flex; flex-wrap:wrap; gap:14px; padding:10px 16px; border-top:1px solid var(--hair);}
.rm-legend-item{display:flex; align-items:center; gap:6px; font-family:var(--mono); font-size:10px; color:var(--muted);}
.rm-legend-dot{width:10px; height:10px; border-radius:2px;}
.rm-legend-plumb{width:2px; height:12px; background:#C0392B;}

.rm-card{background:var(--card); border:1px solid var(--line); margin-top:8px;}
.rm-card.is-open{border-color:var(--ink);}
.rm-card.is-done{background:#F6FAF7;}
.rm-card-head{width:100%; display:flex; align-items:center; gap:14px; padding:13px 15px; text-align:left;}
.rm-phase-n{flex:none; width:34px; height:34px; border-radius:3px; display:flex; align-items:center; justify-content:center; color:#fff; font-family:var(--gs); font-weight:700; font-size:14px;}
.rm-card-titles{flex:1; min-width:0;}
.rm-card-title{display:block; font-family:var(--gs); font-weight:600; font-size:15px; letter-spacing:-.01em; line-height:1.2;}
.rm-card-line{display:flex; align-items:center; gap:8px; margin-top:4px; flex-wrap:wrap;}
.rm-card-target{font-family:var(--mono); font-size:10.5px; color:var(--muted);}
.rm-card-dot{color:var(--faint);}
.rm-card-tag{font-family:var(--mono); font-size:10px; font-weight:600;}
.rm-card-right{display:flex; align-items:center; gap:12px; flex:none;}
.rm-pill{font-family:var(--mono); font-size:9.5px; font-weight:600; padding:2px 8px; border:1px solid; border-radius:10px; letter-spacing:.04em; white-space:nowrap;}
.rm-card-count{font-family:var(--mono); font-size:12px; font-weight:600; min-width:34px; text-align:right;}
.rm-minibar{width:58px; height:5px; background:var(--hair); border-radius:3px; overflow:hidden;}
.rm-minibar span{display:block; height:100%; border-radius:3px; transition:width .35s ease;}
.rm-chev{transition:transform .2s; color:var(--faint);}
.rm-card.is-open .rm-chev{transform:rotate(90deg);}

.rm-card-body{padding:4px 16px 18px; border-top:1px solid var(--hair);}
.rm-objective{font-size:13px; line-height:1.55; color:var(--muted); margin:13px 0;}
.rm-flag{display:flex; gap:9px; align-items:flex-start; background:#FBF3F0; border:1px solid #E9C4B8; color:#8A3D28; padding:10px 12px; margin:0 0 14px; font-size:12.5px; line-height:1.5;}
.rm-flag svg{flex:none; margin-top:1px; color:#C0562F;}

.rm-smart{margin:0 0 14px; border:1px solid var(--hair);}
.rm-smart-row{display:grid; grid-template-columns:34px 1fr; border-bottom:1px solid var(--hair);}
.rm-smart-row:last-child{border-bottom:none;}
.rm-smart-k{font-family:var(--gs); font-weight:700; font-size:14px; text-align:center; padding:9px 0; border-right:1px solid var(--hair); background:#F5F8FA;}
.rm-smart-v{padding:9px 12px; font-size:12.6px; line-height:1.5;}

.rm-spec{display:grid; grid-template-columns:1fr 1fr; border:1px solid var(--hair); margin-bottom:16px;}
.rm-spec-cell{padding:8px 12px; border-right:1px solid var(--hair); border-bottom:1px solid var(--hair);}
.rm-spec-cell.nb{border-right:none;}
.rm-spec-cell.is-full{grid-column:1/-1; border-right:none;}
.rm-spec-cell.is-full.last{border-bottom:none;}
.rm-spec-k{display:block; font-family:var(--mono); font-size:9px; letter-spacing:.14em; color:var(--faint); text-transform:uppercase;}
.rm-spec-v{display:block; font-family:var(--mono); font-size:11px; margin-top:3px; line-height:1.4;}

.rm-creds-head{font-family:var(--mono); font-size:10px; letter-spacing:.14em; color:var(--muted); margin-bottom:8px;}
.rm-cred{border:1px solid var(--hair); margin-bottom:8px;}
.rm-cred:last-child{margin-bottom:0;}
.rm-cred-head{display:flex; align-items:center; gap:11px; padding:9px 12px; background:#F7F9FB; border-bottom:1px solid var(--hair);}
.rm-cred-plate{flex:none; width:26px; height:26px; display:flex;}
.rm-cred-title{flex:1; font-family:var(--gs); font-weight:600; font-size:13.5px;}
.rm-cred-count{font-family:var(--mono); font-size:11px; font-weight:600; color:var(--muted);}
.rm-cred-minibar{width:44px; height:4px; background:var(--hair); border-radius:3px; overflow:hidden;}
.rm-cred-minibar span{display:block; height:100%; border-radius:3px; transition:width .35s ease;}

.rm-ms{padding:4px 12px 6px;}
.rm-ms-row{width:100%; display:flex; align-items:center; gap:11px; padding:7px 2px; text-align:left; border-bottom:1px solid var(--hair);}
.rm-ms-row:last-child{border-bottom:none;}
.rm-ms-box{flex:none; width:17px; height:17px; border:1.5px solid var(--line); border-radius:3px; display:flex; align-items:center; justify-content:center; transition:all .15s;}
.rm-ms-label{font-size:12.6px; transition:color .15s;}
.rm-ms-row.is-on .rm-ms-label{color:var(--muted); text-decoration:line-through; text-decoration-color:var(--line);}

.rm-open-list{list-style:none; margin:0; padding:12px 16px; display:grid; gap:9px;}
.rm-open-list li{display:flex; align-items:flex-start; gap:9px; font-size:13px; line-height:1.5;}
.rm-open-list svg{flex:none; margin-top:3px; color:#B8791F;}
.rm-open-list b{font-weight:600;}

.rm-foot{display:flex; justify-content:space-between; align-items:center; margin-top:20px; padding-top:14px; border-top:1px solid var(--hair); font-family:var(--mono); font-size:10.5px; color:var(--faint); flex-wrap:wrap; gap:8px;}
.rm-reset{display:flex; align-items:center; gap:6px; font-family:var(--mono); font-size:10.5px; color:var(--muted); padding:5px 10px; border:1px solid var(--line); border-radius:3px;}
.rm-reset:hover{border-color:#C0392B; color:#C0392B;}

@media (max-width:640px){
  .rm-root{padding:18px 14px 50px;}
  .rm-titleblock{flex-direction:column;}
  .rm-tb-right{width:100%; justify-content:space-between;}
  .rm-readout{grid-template-columns:1fr 1fr 1fr;}
  .rm-readout-cell:nth-child(n+4){border-top:1px solid var(--hair);}
  .rm-spec{grid-template-columns:1fr;}
  .rm-spec-cell{border-right:none;}
  .rm-card-right .rm-pill{display:none;}
  .rm-card-head{gap:10px; padding:12px;}
  .rm-minibar{width:40px;}
}
@media (prefers-reduced-motion:reduce){ *{transition:none !important;} }
</style>

    start:"2027-02-09", end:"2027-06-28", months:"Months 8-12", hoursWk:"8-10 hrs/wk", cost:"\u2248 $49/mo Coursera \u00b7 \u2248 $150 Python Institute exam",
    certLabel:"Python cert \u00b7 Google IT Automation \u00b7 AI Essentials", resources:"Coursera (Google Professional Certificate tracks) \u00b7 Python Institute \u00b7 Automate the Boring Stuff with Python (Al Sweigart)",
    flag:"This moves the Google IT Automation cert to mid-2027. Your earlier plan had it as a Dec 2026 'Christmas present' \u2014 if you still want that one done this year, pull it forward into Phase 1-2.",
    smart:{ S:"Complete the Google IT Automation series, the AI Essentials course, and sit for an entry-level Python cert.", M:"Finish all Coursera labs and pass the final Python certification exam.", A:"Self-paced Coursera track; your new networking knowledge makes the automation tasks highly contextual.", R:"Python is the native scripting language for modern SCADA platforms like Ignition.", T:"Complete within 20 weeks." },
    credentials:[
      { id:"it-automation", title:"Google IT Automation with Python", milestones:["Enroll on Coursera","Courses 1-3 (Python \u00b7 OS \u00b7 Git)","Courses 4-6 (Debug \u00b7 Config/Cloud \u00b7 Capstone)","Download certificate"] },
      { id:"ai-essentials", title:"Google AI Essentials", milestones:["Enroll","Complete modules","Earn certificate"] },
      { id:"python-cert", title:"Python Certification (PCEP / PCAP)", milestones:["Decide PCEP vs PCAP","Gap-study the delta","Register for exam","Pass exam"] }
    ] },
  { n:"04", title:"Applied SCADA & Heavy Operations", focus:"Applied SCADA & heavy ops", color:"#9E3B4E",
    objective:"Merge programming, networking, and field knowledge into industrial automation software while unlocking heavy-equipment logistics.",
    start:"2027-06-29", end:"2027-10-18", months:"Months 13-16", hoursWk:"15 hrs/wk", cost:"Ignition free \u00b7 CDL \u2248 $1,500-$5,000",
    certLabel:"Ignition Core \u00b7 CDL", resources:"Inductive University (free Ignition credential path) \u00b7 Local community college / private CDL program (FMCSA ELDT-compliant)",
    flag:"Heaviest load of the program (15 hrs/wk), and CDL behind-the-wheel time competes with everything else. Confirm Class A vs B and the reason CDL is on the list.",
    smart:{ S:"Graduate a local CDL school and pass the state exam; complete the Inductive Automation Ignition Core credential.", M:"Physical CDL license + verified Ignition Core certificate.", A:"Ignition training is free & online; CDL behind-the-wheel hours fit into weekend blocks.", R:"Ignition is the dominant modern SCADA software using your exact Python/networking stack; CDL enables heavy field-asset deployment.", T:"Complete within 16 weeks." },
    credentials:[
      { id:"ignition-core", title:"Inductive Automation \u2014 Ignition Core", milestones:["Create Inductive University account","Complete Ignition Core learning path","Pass Core Certification exam"] },
      { id:"cdl", title:"CDL \u2014 Class A or B (California)", milestones:["Confirm Class A vs B + rationale","DOT physical \u2192 Medical Card","Pass CLP knowledge tests \u2192 CLP","Complete FMCSA ELDT (theory + BTW)","Hold CLP \u2265 14 days","Pass skills test \u2192 CDL"] }
    ] },
  { n:"05", title:"Capstone \u2014 Professional Engineering License", focus:"PE licensure (capstone)", color:"#8A6D2A",
    objective:"Solidify your mechanical expertise with a legal engineering credential that ties machine design to your automated control systems.",
    start:"2027-10-19", end:"2028-07-03", months:"Months 17-24", hoursWk:"12-15 hrs/wk", cost:"\u2248 $350-$1,000 review \u00b7 $375 NCEES exam",
    certLabel:"PE Mechanical (Machine Design & Materials)", resources:"School of PE or PPI (Lindeburg reference manuals) \u00b7 official NCEES practice exams",
    flag:"Gated by eligibility \u2014 confirm the FE is passed and enough qualifying experience is logged with the CA board (BPELSG) before locking the Nov 2027 start.",
    smart:{ S:"Complete an NCEES-aligned review course and pass the CBT Mechanical: Machine Design & Materials PE exam.", M:"'Pass' notification from NCEES \u00b7 state board licensure secured.", A:"As an FE/EIT holder you have the fundamental baseline; this is focused discipline-specific review.", R:"Grants authority to design, sign, and seal drawings for factory automation, robotic cells, and utility grids.", T:"Complete within 32 weeks of starting this phase." },
    credentials:[
      { id:"pe-mechanical", title:"PE Mechanical \u2014 Machine Design & Materials", milestones:["Confirm eligibility w/ CA BPELSG (FE + experience)","Enroll in review course (School of PE / PPI)","Complete NCEES-aligned review (~300 hrs)","Register for CBT PE exam","Sit & pass PE exam","Secure state board licensure"] }
    ] }
];

var ALL_CREDS = PHASES.reduce(function(a,p){ return a.concat(p.credentials); },[]);
var TOTAL_MS = ALL_CREDS.reduce(function(s,c){ return s+c.milestones.length; },0);
var TOTAL_CREDS = ALL_CREDS.length;

/* ------------------------------- STATE ---------------------------------- */
var progress = load();
var open = { "01": true };

function load(){ try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch(e){ return {}; } }
function save(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(progress)); } catch(e){} }

function credDone(c){ var o=progress[c.id]||{}; return Object.keys(o).length; }
function phaseDone(p){ return p.credentials.reduce(function(s,c){ return s+Math.min(credDone(c),c.milestones.length); },0); }
function phaseTotal(p){ return p.credentials.reduce(function(s,c){ return s+c.milestones.length; },0); }
function phaseStatus(p){ var d=phaseDone(p), t=phaseTotal(p); return d>=t?"done":(d>0?"active":"planned"); }

function totals(){
  var done=0, ph=0;
  PHASES.forEach(function(p){ var d=phaseDone(p); done+=d; if(d>=phaseTotal(p)) ph++; });
  return { done:done, pct: TOTAL_MS?Math.round(done/TOTAL_MS*100):0, phasesDone:ph };
}
function nextDeadline(){
  return PHASES.filter(function(p){ return phaseDone(p)<phaseTotal(p) && daysUntil(p.end)>=0; })
    .sort(function(a,b){ return a.end<b.end?-1:1; })[0] || null;
}

/* ------------------------------ RENDER ---------------------------------- */
function statusPill(st){
  var map={ done:{t:"Complete",c:"#3F9D6D"}, active:{t:"In progress",c:"#B8791F"}, planned:{t:"Planned",c:"#6B7684"} };
  var s=map[st]; return '<span class="rm-pill" style="color:'+s.c+';border-color:'+s.c+'">'+s.t+'</span>';
}
function gauge(pct){
  var r=30, c=2*Math.PI*r, off=c-(pct/100)*c;
  return '<div class="rm-gauge"><svg viewBox="0 0 76 76" width="76" height="76">'+
    '<circle cx="38" cy="38" r="'+r+'" class="rm-gauge-track"/>'+
    '<circle cx="38" cy="38" r="'+r+'" class="rm-gauge-fill" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'" transform="rotate(-90 38 38)"/>'+
    '</svg><div class="rm-gauge-num"><span>'+pct+'</span><small>%</small></div></div>';
}
function titleBlock(){
  var t=totals();
  return '<header class="rm-titleblock"><div class="rm-tb-main">'+
    '<div class="rm-tb-eyebrow">CONTINUING EDUCATION \u00b7 SCADA / INDUSTRIAL-AUTOMATION TRACK</div>'+
    '<h1 class="rm-tb-title">Credential Curriculum</h1>'+
    '<p class="rm-tb-sub">A five-phase, 24-month self-study program \u2014 from field ops to the PE license. Check off each milestone to track completion.</p></div>'+
    '<div class="rm-tb-right">'+gauge(t.pct)+'<div class="rm-tb-meta">'+
    metaCell("Owner","Rob")+metaCell("Discipline","Mechanical Eng.")+metaCell("Start","2026-07-27")+metaCell("Target","2028-07")+
    '</div></div></header>';
}
function metaCell(k,v){ return '<div class="rm-metacell"><span class="rm-metacell-k">'+k+'</span><span class="rm-metacell-v">'+v+'</span></div>'; }
function readoutCell(k,v,sub,accent){ return '<div class="rm-readout-cell'+(accent?" is-accent":"")+'"><span class="rm-readout-k">'+k+'</span><span class="rm-readout-v">'+v+'</span><span class="rm-readout-sub">'+sub+'</span></div>'; }
function readout(){
  var t=totals(), nd=nextDeadline();
  return '<section class="rm-readout">'+
    readoutCell("Phases",t.phasesDone+"/5","complete")+
    readoutCell("Credentials",TOTAL_CREDS,"tracked")+
    readoutCell("Milestones",t.done+"/"+TOTAL_MS,"checked")+
    readoutCell("Duration","24 mo","\u2192 Jul 2028")+
    readoutCell("Next phase due", nd?shortMonth(nd.end):"\u2014", nd?("Phase "+nd.n+" \u00b7 "+daysUntil(nd.end)+"d"):"all clear", true)+
    '</section>';
}
function overview(){
  var rows = PHASES.map(function(p){
    return '<tr><td><span class="rm-ov-n" style="color:'+p.color+'">'+p.n+'</span></td>'+
      '<td><span class="rm-ov-focus">'+esc(p.focus)+'</span><span class="rm-ov-months">'+p.months+'</span></td>'+
      '<td class="rm-ov-mono">'+shortMonth(p.start)+' \u2013 '+shortMonth(p.end)+'</td>'+
      '<td class="rm-ov-certs">'+esc(p.certLabel)+'</td>'+
      '<td class="rm-ov-num rm-ov-mono">'+p.hoursWk.replace(" hrs/wk","")+'</td>'+
      '<td class="rm-ov-mono rm-ov-cost">'+esc(p.cost)+'</td></tr>';
  }).join("");
  return '<section class="rm-panel"><div class="rm-panel-head"><span class="rm-panel-label">CURRICULUM OVERVIEW</span><span class="rm-panel-note">The self-study program at a glance</span></div>'+
    '<div class="rm-ovwrap"><table class="rm-ov"><thead><tr><th>#</th><th>Phase</th><th>Window</th><th>Certifications</th><th class="rm-ov-num">Hrs/wk</th><th>Est. cost</th></tr></thead><tbody>'+rows+'</tbody></table></div></section>';
}
function gantt(){
  var months="";
  for(var i=0;i<AXIS_MONTHS;i++){ var c=monthCol(i); var yr=(c.m===0||i===0); months+='<div class="rm-gantt-mon'+(yr?" is-year":"")+'"><span>'+c.label+'</span>'+(yr?"<em>'"+String(c.y).slice(2)+"</em>":"")+'</div>'; }
  var rows = PHASES.map(function(p){
    var s=toAxis(p.start), e=toAxis(p.end), left=s/AXIS_MONTHS*100, width=Math.max((e-s)/AXIS_MONTHS*100,2);
    var st=phaseStatus(p), pct=Math.round(phaseDone(p)/phaseTotal(p)*100), base=st==="done"?"#3F9D6D":p.color;
    var lbl=p.certLabel.split(" \u00b7 ")[0]+(p.credentials.length>1?" +"+(p.credentials.length-1):"");
    return '<div class="rm-gantt-row"><div class="rm-gantt-rowlabel"><span class="rm-gantt-n" style="color:'+p.color+'">'+p.n+'</span>'+esc(p.focus)+'</div>'+
      '<div class="rm-gantt-track"><div class="rm-gantt-bar" style="left:'+left+'%;width:'+width+'%;background:'+hex(base,0.18)+';border:1.2px solid '+base+'">'+
      '<div class="rm-gantt-fill" style="width:'+pct+'%;background:'+base+'"></div><span class="rm-gantt-bar-label" style="color:'+base+'">'+esc(lbl)+'</span></div></div></div>';
  }).join("");
  var legend = PHASES.map(function(p){ return '<span class="rm-legend-item"><span class="rm-legend-dot" style="background:'+p.color+'"></span> P'+p.n.replace("0","")+'</span>'; }).join("")+
    '<span class="rm-legend-item"><span class="rm-legend-dot" style="background:#3F9D6D"></span> Complete</span>'+
    '<span class="rm-legend-item"><span class="rm-legend-plumb"></span> Today</span>';
  return '<section class="rm-panel"><div class="rm-panel-head"><span class="rm-panel-label">SCHEDULE</span><span class="rm-panel-note">Jul 2026 \u2192 Jul 2028 \u00b7 one bar per phase \u00b7 fill = milestones checked</span></div>'+
    '<div class="rm-gantt-scroll"><div class="rm-gantt"><div class="rm-gantt-months">'+months+'</div>'+
    '<div class="rm-gantt-body"><div class="rm-gantt-overlay"><div class="rm-gantt-today" style="left:'+(todayAxis/AXIS_MONTHS*100)+'%"><span class="rm-gantt-today-tag">TODAY</span></div></div>'+rows+'</div></div></div>'+
    '<div class="rm-legend">'+legend+'</div></section>';
}
/* hex + alpha helper (base is #rrggbb) */
function hex(h,a){ var n=parseInt(h.slice(1),16); var r=(n>>16)&255,g=(n>>8)&255,b=n&255; return "rgba("+r+","+g+","+b+","+a+")"; }

function phaseCard(p){
  var done=phaseDone(p), total=phaseTotal(p), st=phaseStatus(p), pct=Math.round(done/total*100);
  var bar=st==="done"?"#3F9D6D":p.color, isOpen=!!open[p.n];
  var head='<button class="rm-card-head" data-phase="'+p.n+'" aria-expanded="'+isOpen+'">'+
    '<span class="rm-phase-n" style="background:'+p.color+'">'+p.n+'</span>'+
    '<span class="rm-card-titles"><span class="rm-card-title">'+esc(p.title)+'</span>'+
    '<span class="rm-card-line"><span class="rm-card-target">'+shortMonth(p.start)+' \u2013 '+shortMonth(p.end)+'</span><span class="rm-card-dot">\u00b7</span><span class="rm-card-target">'+p.hoursWk+'</span><span class="rm-card-tag" style="color:'+p.color+'">'+p.months+'</span></span></span>'+
    '<span class="rm-card-right">'+statusPill(st)+'<span class="rm-card-count">'+done+'/'+total+'</span>'+
    '<span class="rm-minibar"><span style="width:'+pct+'%;background:'+bar+'"></span></span>'+CHEV+'</span></button>';
  if(!isOpen) return '<article class="rm-card'+(st==="done"?" is-done":"")+'">'+head+'</article>';

  var smart = ["S","M","A","R","T"].map(function(k){ return '<div class="rm-smart-row"><span class="rm-smart-k" style="color:'+p.color+'">'+k+'</span><span class="rm-smart-v">'+esc(p.smart[k])+'</span></div>'; }).join("");
  var spec = '<div class="rm-spec">'+
    '<div class="rm-spec-cell is-full"><span class="rm-spec-k">Window</span><span class="rm-spec-v">'+fmtDate(p.start)+' \u2192 '+fmtDate(p.end)+'</span></div>'+
    '<div class="rm-spec-cell"><span class="rm-spec-k">Weekly time</span><span class="rm-spec-v">'+p.hoursWk+'</span></div>'+
    '<div class="rm-spec-cell nb"><span class="rm-spec-k">Est. cost</span><span class="rm-spec-v">'+esc(p.cost)+'</span></div>'+
    '<div class="rm-spec-cell is-full last"><span class="rm-spec-k">Resources</span><span class="rm-spec-v">'+esc(p.resources)+'</span></div></div>';
  var flag = p.flag ? '<div class="rm-flag">'+WARN+'<span>'+esc(p.flag)+'</span></div>' : "";
  var creds = p.credentials.map(function(c){
    var cd=credDone(c), cpct=Math.round(cd/c.milestones.length*100), cc=cd>=c.milestones.length?"#3F9D6D":p.color, chk=progress[c.id]||{};
    var ms = c.milestones.map(function(m,i){ var on=!!chk[i];
      return '<button class="rm-ms-row'+(on?" is-on":"")+'" role="checkbox" aria-checked="'+on+'" data-cred="'+c.id+'" data-idx="'+i+'">'+
        '<span class="rm-ms-box" style="'+(on?"background:"+cc+";border-color:"+cc:"")+'">'+(on?CHECK:"")+'</span>'+
        '<span class="rm-ms-label">'+esc(m)+'</span></button>';
    }).join("");
    return '<div class="rm-cred"><div class="rm-cred-head"><span class="rm-cred-plate" style="color:'+p.color+'">'+plateSVG(c.id,26)+'</span>'+
      '<span class="rm-cred-title">'+esc(c.title)+'</span><span class="rm-cred-count">'+cd+'/'+c.milestones.length+'</span>'+
      '<span class="rm-cred-minibar"><span style="width:'+cpct+'%;background:'+cc+'"></span></span></div><div class="rm-ms">'+ms+'</div></div>';
  }).join("");
  var body='<div class="rm-card-body"><p class="rm-objective">'+esc(p.objective)+'</p>'+flag+
    '<div class="rm-smart">'+smart+'</div>'+spec+'<div class="rm-creds-head">CREDENTIALS IN THIS PHASE</div>'+creds+'</div>';
  return '<article class="rm-card is-open'+(st==="done"?" is-done":"")+'">'+head+body+'</article>';
}
function openInputs(){
  var items=[
    "<b>Weekly hours</b> \u2014 the plan escalates from 5-7 up to 15 hrs/wk in Phase 4. Is that sustainable alongside work?",
    "<b>The Christmas cert</b> \u2014 Phase 3 pushes Google IT Automation to mid-2027. Keep it there, or pull it into 2026?",
    "<b>PE eligibility</b> \u2014 FE passed, and roughly how much qualifying experience logged? This gates the Phase 5 start.",
    "<b>CDL class & why</b> \u2014 Class A or B, and the reason it's in the SCADA track."
  ].map(function(t){ return '<li>'+FLAGICON+' <span>'+t+'</span></li>'; }).join("");
  return '<section class="rm-panel"><div class="rm-panel-head"><span class="rm-panel-label">OPEN INPUTS</span><span class="rm-panel-note">Decisions that turn these windows into a week-by-week calendar</span></div><ul class="rm-open-list">'+items+'</ul></section>';
}
function footer(){
  return '<footer class="rm-foot"><span>Progress saves automatically in this browser.</span>'+
    '<button class="rm-reset" id="rm-reset"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg> Reset progress</button></footer>';
}

function render(){
  var y = window.scrollY;
  document.getElementById("root").innerHTML =
    titleBlock() + readout() + overview() + gantt() +
    PHASES.map(phaseCard).join("") + openInputs() + footer();
  window.scrollTo(0, y);
}

/* ---------------------------- INTERACTION ------------------------------- */
document.getElementById("root").addEventListener("click", function(ev){
  var ms = ev.target.closest("[data-cred]");
  if(ms){ var id=ms.getAttribute("data-cred"), i=ms.getAttribute("data-idx");
    var o=progress[id]||{}; if(o[i]) delete o[i]; else o[i]=true; progress[id]=o; save(); render(); return; }
  var ph = ev.target.closest("[data-phase]");
  if(ph){ var n=ph.getAttribute("data-phase"); open[n]=!open[n]; render(); return; }
  if(ev.target.closest("#rm-reset")){
    if(confirm("Clear all checked milestones? This can't be undone.")){ progress={}; save(); render(); }
  }
});

render();
</script>
</body>
</html>
